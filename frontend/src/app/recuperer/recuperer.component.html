<section class="connexion">
  <div class="backcontainer">
    <div class="row justify-content-md-center">
      <div class="col-md-8 col-lg-6">
        <!-- Afficher le formulaire de nom d'utilisateur si usr est faux -->
        <form *ngIf="!usr">
          <div><h3>Update password</h3></div>
          <div class="input-group-prepend">
            <img src="assets/images/7c87059fbffad15e2cca21f1dc87a335-removebg-preview.png" alt="Logo" class="img-fluid" style="border-radius: 0 1rem 1rem 0; height: 100px; margin-left: 120px; ">
          </div>
          <div class="form-group">
            <label for="validationDefaultUsername">Username</label>
            <div class="input-group">
              <input type="text" name="username" [(ngModel)]="username" class="form-control" placeholder="User name" required>
            </div>
          </div>
      
          <button type="button" class="btn btn-success mt-3" (click)="verifier()">Validate username</button>
        </form>
        
        <!-- Afficher le formulaire de modification de mot de passe si usr est vrai -->
        <form *ngIf="usr" [formGroup]="myForm2" >
          <div class="form-group">
            <div class="form-row">
              <div class="col-md-8 mb-3">
                <label>Password :</label>
                <input type="password" name="password" formControlName="password" [(ngModel)]="password" class="form-control" style="width: 430px;">
              </div>
              <span *ngIf="myForm2.controls['password'].hasError('required') && myForm2.controls['password'].touched" class="text-danger">Password is required</span>
              <span *ngIf="myForm2.controls['password'].hasError('minlength') && myForm2.controls['password'].touched" class="text-danger">Password must be at least 6 characters </span>
            </div>
          </div>
          <div class="form-group">
            <div class="form-row">
              <div class="col-md-8 mb-3">
                <label>Confirm Password:</label>
                <input type="password" name="confirmPassword" formControlName="confirmPassword" class="form-control" style="width: 430px;">
              </div>
              <span *ngIf="myForm2.controls['confirmPassword'].hasError('required') && myForm2.controls['confirmPassword'].touched" class="text-danger">confirmer mot de passe est obligatoire</span>
              <div>
                <span *ngIf="myForm2.get('confirmPassword')?.touched && myForm2.get('confirmPassword')?.value != myForm2.get('password')?.value" class="text-danger">Le mot de passe confirmé ne correspond pas au mot de passe tapé</span>
              </div>
            </div>
          </div>
     
          <button type="button" [disabled]="myForm2.invalid" class="btn btn-success" (click)="modifier()">Valider modification</button>
        </form>
      </div>
    </div>
  </div>
</section>
