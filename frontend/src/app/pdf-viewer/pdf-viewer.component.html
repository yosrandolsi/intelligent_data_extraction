<div class="file-upload-container">
    <input id="fileInput" type="file" (change)="onFileSelected($event)">
    <div *ngIf="imageSrc" class="image-container">
      <img [src]="imageSrc" style="display: block; max-width: 500px;">
    </div>
    <div class="pdf-container" *ngIf="pdfSrc">
        <pdf-viewer [src]="pdfSrc" style="display: block; height: 500px;"></pdf-viewer>
      </div>
  </div>
