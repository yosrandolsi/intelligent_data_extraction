<app-navbar></app-navbar>
<section class="listUsers">
  <div class="backcontainer">
    <div class="container">
      <div class="filter-and-add-container">
        <div class="container-input">
          <input class="input" type="text" aria-label="Filter by Name:" aria-describedby="basic-addon1" [(ngModel)]="filterName" (input)="filter()" placeholder="Enter the user Name">
          <svg fill="#000000" width="20px" height="20px" viewBox="0 0 1920 1920" xmlns="http://www.w3.org/2000/svg">
            <path d="M790.588 1468.235c-373.722 0-677.647-303.924-677.647-677.647 0-373.722 303.925-677.647 677.647-677.647 373.723 0 677.647 303.925 677.647 677.647 0 373.723-303.924 677.647-677.647 677.647Zm596.781-160.715c120.396-138.692 193.807-319.285 193.807-516.932C1581.176 354.748 1226.428 0 790.588 0S0 354.748 0 790.588s354.748 790.588 790.588 790.588c197.647 0 378.24-73.411 516.932-193.807l516.028 516.142 79.963-79.963-516.142-516.028Z" fill-rule="evenodd"></path>
          </svg>
        </div>
        <br>
      </div>
      <div class="table-frame">
        <table class="table table-custom">
          <thead>
            <tr>
              <th colspan="6" class="custom-header">
                <div class="header-container">
                  <span>List of users</span>
                  <span class="total-users">Total of users: {{ totalUsers }}</span>
                </div>
              </th>
            </tr>
            <tr style="color: #666;">
              <th style="color: #666;">User name</th>
              <th style="color: #666;">Matricule</th>
              <th style="color: #666;">Roles</th>
              <th style="color: #666;">Email</th>
              <th style="color: #666;">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of filteredUsers">
              <td style="padding-left: 10px;">
                <img [src]="user.profileImg || 'assets/images/user.jpg'" alt="Profile Picture" width="35" height="35" class="rounded-circle">
                {{ user.username }}
              </td>
              
              <td>{{ user.matricule }}</td>
              <td>
                <ul class="role-list">
                  <li *ngFor="let role of user.roles">{{ role.role }}</li>
                </ul>
              </td>
              <td>{{ user.email }}</td>
              <td>
                <button class="noselect cancel-button custom-button" (click)="goToDetail(user.id)">
                  <span class="text">Details</span>
                  <span class="icon">
                    <i class="fa-regular fa-user white-icon" style="color: white;"></i>
                  </span>
                </button>
              </td>
              <td>
                <button class="noselect custom-button" (click)="toggleAddRoleFormForUser(user)">
                  <span class="text">Role</span>
                  <span class="icon">
                    <i class="fa-solid fa-plus" style="color: white;"></i>
                  </span>
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <!-- Role Management Section -->
<div class="role-selection-container" *ngIf="selectedUser">
  <div class="role-selection">
    <div class="title-container">
      <h3 style="color: #666;">Manage roles of <span style="color: #1d61a2;">{{ selectedUser.username }}</span></h3>
      <div class="cancel-icon" (click)="cancelAddRole()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10.707 10l4.147-4.146a.5.5 0 0 0-.707-.707L10 9.293 5.854 5.146a.5.5 0 0 0-.707.707L9.293 10l-4.146 4.146a.5.5 0 0 0 .707.707L10 10.707l4.146 4.147a.5.5 0 0 0 .707-.707L10.707 10z"/>
        </svg>
      </div>
    </div>
    <ul class="user-roles">
      <li *ngFor="let role of selectedUser.roles">
        {{ role.role }}
      </li>
    </ul>
    <div class="role-management-buttons">
      <div class="button-container">
        <button class="add-role-button" (click)="addRoleToUser(selectedUser, 'USER')">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
            <path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32V224H48c-17.7 0-32 14.3-32 32s14.3 32 32 32H192V432c0 17.7 14.3 32 32 32s32-14.3 32-32V288H400c17.7 0 32-14.3 32-32s-14.3-32-32-32H256V80z"/>
          </svg>
        </button>
        <button class="remove-role-button" (click)="removeRoleFromUser(selectedUser, 'USER')">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
            <path d="M432 256c0 17.7-14.3 32-32 32L48 288c-17.7 0-32-14.3-32-32s14.3-32 32-32l352 0c17.7 0 32 14.3 32 32z"/>
          </svg>
        </button>
        <span>User Role</span>
      </div>
      <div class="button-container admin-buttons">
        <button class="add-role-button" (click)="addRoleToUser(selectedUser, 'ADMIN')">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
            <path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32V224H48c-17.7 0-32 14.3-32 32s14.3 32 32 32H192V432c0 17.7 14.3 32 32 32s32-14.3 32-32V288H400c17.7 0 32-14.3 32-32s-14.3-32-32-32H256V80z"/>
          </svg>
        </button>
        <button class="remove-role-button" (click)="removeRoleFromUser(selectedUser, 'ADMIN')">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512">
            <path d="M432 256c0 17.7-14.3 32-32 32L48 288c-17.7 0-32-14.3-32-32s14.3-32 32-32l352 0c17.7 0 32 14.3 32 32z"/>
          </svg>
        </button>
        <span>Admin Role</span>
      </div>
    </div>
    <div class="save-cancel-buttons">
      <button class="noselect cancel-button custom-button" (click)="saveRoleChanges()">
        <span class="text">Save</span>
        <span class="icon">
          <!-- Utilisez l'icône de coche de Material Icons en gras -->
          <svg class="save-regular" xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 384 512"><path d="M0 48C0 21.5 21.5 0 48 0l0 48V441.4l130.1-92.9c8.3-6 19.6-6 27.9 0L336 441.4V48H48V0H336c26.5 0 48 21.5 48 48V488c0 9-5 17.2-13 21.3s-17.6 3.4-24.9-1.8L192 397.5 37.9 507.5c-7.3 5.2-16.9 5.9-24.9 1.8S0 497 0 488V48z"></path></svg>
        </span>
      </button>
    
      <div style="margin-left: 50px;"></div>
    
      <button class="noselect custom-button" (click)="cancelRoleChanges()">
        <span class="text">Cancel</span>
        <span class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
            <path d="M24 20.188l-8.315-8.209 8.2-8.282-3.697-3.697-8.212 8.318-8.31-8.203-3.666 3.666 8.321 8.24-8.206 8.313 3.666 3.666 8.237-8.318 8.285 8.203z"></path>
          </svg>
        </span>
      </button>
    </div>
    
    <div class="error" *ngIf="errorMessage">
      <div class="error__icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" viewBox="0 0 24 24" height="24" fill="none">
          <path fill="#393a37" d="m13 13h-2v-6h2zm0 4h-2v-2h2zm-1-15c-1.3132 0-2.61358.25866-3.82683.7612-1.21326.50255-2.31565 1.23915-3.24424 2.16773-1.87536 1.87537-2.92893 4.41891-2.92893 7.07107 0 2.6522 1.05357 5.1957 2.92893 7.0711.92859.9286 2.03098 1.6651 3.24424 2.1677 1.21325.5025 2.51363.7612 3.82683.7612 2.6522 0 5.1957-1.0536 7.0711-2.9289 1.8753-1.8754 2.9289-4.4189 2.9289-7.0711 0-1.3132-.2587-2.61358-.7612-3.82683-.5026-1.21326-1.2391-2.31565-2.1677-3.24424-.9286-.92858-2.031-1.66518-3.2443-2.16773-1.2132-.50254-2.5136-.7612-3.8268-.7612z"></path>
        </svg>
      </div>
      <div class="error__title">{{ errorMessage }}</div>
      <div class="error__close" (click)="clearError()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" viewBox="0 0 20 20" height="20">
          <path fill="#393a37" d="m15.8333 5.34166-1.175-1.175-4.6583 4.65834-4.65833-4.65834-1.175 1.175 4.65833 4.65834-4.65833 4.6583 1.175 1.175 4.65833-4.6583 4.6583 4.6583 1.175-1.175-4.6583-4.6583z"></path>
        </svg>
      </div>
    </div>
  </div>
</div>
