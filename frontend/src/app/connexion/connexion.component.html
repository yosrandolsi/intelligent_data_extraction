<section class="connexion">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col col-xl-10">
        <div class="card" style="border-radius: 1rem;">
          <div class="row g-0">
            <div class="col-md-6 col-lg-5 d-none d-md-block" style="margin-top: 80px;">
              <img src="assets/images/c8.png" alt="Logo" class="img-fluid" style="border-radius: 1rem 0 0 1rem;" />
          </div>
          
            <div class="col-md-6 col-lg-7 d-flex align-items-center">
              
              <div class="card-body p-4 p-lg-5 text-black">

                <form (ngSubmit)="onLoggedin()">
                  
                  <div class="d-flex align-items-center mb-3 pb-1">
                    <i class="fas fa-cubes fa-2x me-3" style="color: #ff6219;"></i>
                    <img src="assets/images/centro.png" alt="Votre logo" style="max-width: 350px; margin-left: -400px; margin-top: -70px;" />
                    <h5 class="" style="letter-spacing: 1px; color: #1d61a2; font-size: 50px; margin-top: 50px;">Welcome back!</h5>
                  </div>
                 
                  <h5 class="fw-normal mb-3 pb-3" style="letter-spacing: 1px; color:orange


                  ;">Sign in to your account</h5>
                
                  <div class="form-outline mb-4">
                    <input type="email" id="email" class="form-control form-control-lg" [(ngModel)]="user.username" name="username"  placeholder="Enter your username" style="font-size: medium;"/>
                    <label class="form-label" for="email">Username</label>
                  </div>
                
                  <div class="form-outline mb-4">
                    <input type="password" id="password" class="form-control form-control-lg" [(ngModel)]="user.password" placeholder="Enter your password" style="font-size: medium;"  name="password"/>
                    <label class="form-label" for="password">Password</label>
                  </div>
                
                  <div class="pt-1 mb-4">
                  
                    <button class="noselect custom-button" type="submit">
                      <span class="text" style="align-items: center;">login</span>
                      <span class="icon">
                        <i class="fa-solid fa-plus" style="color: white;"></i>
                      </span>
                    </button>
                  </div>
                

                  <a class="small text-muted" routerLink="/inscrit">Don't have an account? Sign Up</a>
                </form>
                

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
