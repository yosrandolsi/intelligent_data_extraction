<app-navbar></app-navbar>

<div class="container mt-5">
  <div class="row justify-content-md-center">
    <div class="col-md-8">
      <div class="col-md-4"></div>
      <section class="profile">
        <div class="backcontainer"></div>
      </section>
      <!-- Section de l'en-tête du profil -->


      <!-- Formulaire de profil en mode affichage -->
      <form style="width: 900px; margin-left: -120px;" *ngIf="!isEditMode">
        <div class="row">
          <!-- Colonne pour l'image -->
          <div class="col-md-4">

              <p style="font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 40px;color: orange;">Your profile</p>
          
            <div class="form-group">
              <label for="profileImage">Profile Image</label>
              <img [src]="profileImage" alt="Profile Picture" width="130" height="130" style="border-radius: 50%;">
              <h2 style="color: #1d61a2;">{{user.name}} {{user.lastName}}</h2>
            </div>
            <div class="form-group">
              <label for="roles">Roles</label>
              <div class="card">
                <div class="card-body">
                  <ul>
                    <li *ngFor="let role of user.roles">{{ role.role }}</li>
                  </ul>
                </div>
              </div>
            </div>
            <div class="form-group">
              <label for="roles">Matricule</label>
              {{ user.matricule }}
            </div>
          </div>

          <!-- Colonne pour les champs d'entrée -->
          <div class="col-md-8">
            <div class="row">
              <div class="col-md-12">
                <div class="form-group">
                  <label for="username">Username</label>
                  <input type="text" class="form-control" id="username" [(ngModel)]="user.username" name="username" readonly style="width: 455px;">
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label for="name">First Name</label>
                  <input type="text" class="form-control" id="name" [(ngModel)]="user.name" name="name" readonly>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group">
                  <label for="lastName">Last Name</label>
                  <input type="text" class="form-control" id="lastName" [(ngModel)]="user.lastName" name="lastName" readonly>
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-12">
                <div class="form-group">
                  <label for="email">Email</label>
                  <input type="email" class="form-control" id="email" [(ngModel)]="user.email" name="email" readonly style="width: 455px;">
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label for="matricule">Adresse</label>
                  <input type="text" class="form-control" id="matricule" [(ngModel)]="user.address" name="matricule" readonly>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group">
                  <label for="tel">Telephone</label>
                  <input type="text" class="form-control" id="tel" [(ngModel)]="user.tel" name="tel" readonly>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="button-row1">
          <button class="edit-button" (click)="toggleEditMode()">
            <svg class="edit-svgIcon" viewBox="0 0 512 512">
              <path d="M410.3 231l11.3-11.3-33.9-33.9-62.1-62.1L291.7 89.8l-11.3 11.3-22.6 22.6L58.6 322.9c-10.4 10.4-18 23.3-22.2 37.4L1 480.7c-2.5 8.4-.2 17.5 6.1 23.7s15.3 8.5 23.7 6.1l120.3-35.4c14.1-4.2 27-11.8 37.4-22.2L387.7 253.7 410.3 231zM160 399.4l-9.1 22.7c-4 3.1-8.5 5.4-13.3 6.9L59.4 452l23-78.1c1.4-4.9 3.8-9.4 6.9-13.3l22.7-9.1v32c0 8.8 7.2 16 16 16h32zM362.7 18.7L348.3 33.2 325.7 55.8 314.3 67.1l33.9 33.9 62.1 62.1 33.9 33.9 11.3-11.3 22.6-22.6 14.5-14.5c25-25 25-65.5 0-90.5L453.3 18.7c-25-25-65.5-25-90.5 0zm-47.4 168l-144 144c-6.2 6.2-16.4 6.2-22.6 0s-6.2-16.4 0-22.6l144-144c6.2-6.2 16.4-6.2 22.6 0s6.2 16.4 0 22.6z"></path>
            </svg>
          </button>
        </div>
      </form>

      <!-- Formulaire de profil en mode édition -->
      <form #editForm="ngForm" (ngSubmit)="onSubmit()" *ngIf="isEditMode" style="width: 900px; margin-left: -120px;">
        <div class="row">
          <!-- Colonne pour l'image -->
          <div class="col-md-4" style="position: relative;">
            <p style="font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, sans-serif; font-size: 40px; color: orange;" >Edit profile</p>
            <label for="profileImage">Profile Image</label>
            <img [src]="profileImage" alt="Profile Picture" width="130" height="130" style="border-radius: 50%;" (click)="fileInput.click()">
            <!-- Cercle avec la nouvelle couleur -->
            <svg fill="#1d61a2" height="24px" width="24px" viewBox="0 0 24 24" style="position: absolute; margin-left: -25px; margin-top: 90px;">
              <circle cx="12" cy="12" r="12"/>
            </svg>
            <!-- Icône SVG à l'intérieur du cercle -->
            <svg fill="white" height="12px" width="12px" viewBox="0 0 487 487" style="position: absolute; margin-left: -19px; margin-top: 95px;">
              <!-- Incorporation du code SVG fourni -->
              <g id="SVGRepo_iconCarrier">
                <g>
                  <g>
                    <path d="M308.1,277.95c0,35.7-28.9,64.6-64.6,64.6s-64.6-28.9-64.6-64.6s28.9-64.6,64.6-64.6S308.1,242.25,308.1,277.95z M440.3,116.05c25.8,0,46.7,20.9,46.7,46.7v122.4v103.8c0,27.5-22.3,49.8-49.8,49.8H49.8c-27.5,0-49.8-22.3-49.8-49.8v-103.9v-122.3l0,0c0-25.8,20.9-46.7,46.7-46.7h93.4l4.4-18.6c6.7-28.8,32.4-49.2,62-49.2h74.1c29.6,0,55.3,20.4,62,49.2l4.3,18.6H440.3z M97.4,183.45c0-12.9-10.5-23.4-23.4-23.4c-13,0-23.5,10.5-23.5,23.4s10.5,23.4,23.4,23.4C86.9,206.95,97.4,196.45,97.4,183.45z M358.7,277.95c0-63.6-51.6-115.2-115.2-115.2s-115.2,51.6-115.2,115.2s51.6,115.2,115.2,115.2S358.7,341.55,358.7,277.95z"/>
                  </g>
                </g>
              </g>
            </svg>
            <input #fileInput style="display:none" type="file" (change)="onImageChange($event)">
            <h2 style="color: #1d61a2;">{{user.name}} {{user.lastName}}</h2>
          </div>
          
          
          
          

          <div class="col-md-8">
            <div class="row">
              <div class="col-md-12">
                <div class="form-group">
                  <label for="username">Username</label>
                  <input type="text" class="form-control" id="username" [(ngModel)]="user.username" name="username" style="width: 455px;">
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label for="name">First Name</label>
                  <input type="text" class="form-control" id="name" [(ngModel)]="user.name" name="name" >
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group">
                  <label for="lastName">Last Name</label>
                  <input type="text" class="form-control" id="lastName" [(ngModel)]="user.lastName" name="lastName" >
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-12">
                <div class="form-group">
                  <label for="email">Email</label>
                  <input type="email" class="form-control" id="email" [(ngModel)]="user.email" name="email" readonly style="width: 455px;"> 
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6">
                <div class="form-group">
                  <label for="matricule">Adresse</label>
                  <input type="text" class="form-control" id="matricule" [(ngModel)]="user.address" name="matricule" >
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-group">
                  <label for="tel">Telephone</label>
                  <input type="text" class="form-control" id="tel" [(ngModel)]="user.tel" name="tel" >
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="button-row" >
          <button class="noselect cancel-button" (click)="onSubmit()">
            <span class="text">Save</span>
            <span class="icon">
              <svg class="save-regular" xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 384 512"><path d="M0 48C0 21.5 21.5 0 48 0l0 48V441.4l130.1-92.9c8.3-6 19.6-6 27.9 0L336 441.4V48H48V0H336c26.5 0 48 21.5 48 48V488c0 9-5 17.2-13 21.3s-17.6 3.4-24.9-1.8L192 397.5 37.9 507.5c-7.3 5.2-16.9 5.9-24.9 1.8S0 497 0 488V48z"></path></svg>
            </span>
          </button>
          <div style="margin-left: 50px;"></div>
          <button class="noselect" class="cancel-button" (click)="toggleEditMode()">
            <span class="text">Cancel</span>
            <span class="icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                <path d="M24 20.188l-8.315-8.209 8.2-8.282-3.697-3.697-8.212 8.318-8.31-8.203-3.666 3.666 8.321 8.24-8.206 8.313 3.666 3.666 8.237-8.318 8.285 8.203z"></path>
              </svg>
            </span>
          </button>
        </div>
      </form>

    </div>
  </div>
</div>
